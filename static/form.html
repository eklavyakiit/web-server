
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | GoServer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b14;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #12121e;
            border: 1px solid #29293d;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.3);
        }

        .logo {
            color: #a78bfa;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .tag {
            color: #c4b5fd;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .description {
            color: #a1a1b5;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 10px;
            color: #dedeea;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            background: #0b0b14;
            border: 1px solid #343449;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            margin-bottom: 23px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        input::placeholder {
            color: #66667b;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #8b5cf6;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #7c3aed;
        }

        .back {
            display: block;
            text-align: center;
            color: #a1a1b5;
            text-decoration: none;
            font-size: 14px;
            margin-top: 25px;
        }

        .back:hover {
            color: #c4b5fd;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">GoServer.</div>

        <div class="tag">LET'S CONNECT</div>

        <h1>Tell us about yourself.</h1>

        <p class="description">
            Fill in your details below and submit the form.
            Your Go server will receive the information through
            an HTTP POST request.
        </p>

        <form action="/form" method="POST">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="address">Address</label>
            <input
                type="text"
                id="address"
                name="address"
                placeholder="Enter your address"
                required
            >

            <button type="submit">Submit Details &rarr;</button>

        </form>

        <a href="/" class="back">&larr; Back to home</a>

    </div>

</body>
</html>
